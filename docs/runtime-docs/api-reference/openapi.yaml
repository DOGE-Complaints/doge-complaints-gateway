openapi: 3.1.0
info:
  title: DOGE Complaints Gateway Runtime API
  version: 0.1.0
  summary: Runtime reference for the current FastAPI/handler API surface
  description: |
    This specification is split into two states:
    - as-is: behavior implemented in `src/core/api/asgi_app.py` + `src/core/api/handlers.py`;
    - planned: higher-level endpoints not yet wired in runtime.

    Important:
    The current runtime is FastAPI/ASGI-based and exposes operational routes directly.
servers:
  - url: dogestonia-tallinn.up.railway.app
    description: Illustrative server URL for reference only
tags:
  - name: Ops
    description: Operational endpoints mapped to existing handlers
  - name: Intake
    description: Story-first intake contract surface
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceToken
    ServiceTokenHeader:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    ErrorBody:
      type: object
      required: [code, type, message, details]
      properties:
        code:
          type: string
          examples: [UNAUTHORIZED, VALIDATION_ERROR, DOMAIN_ERROR, INFRASTRUCTURE_ERROR, INTERNAL_ERROR]
        type:
          type: string
          examples: [auth, validation, domain, infrastructure, internal]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error, trace_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        trace_id:
          type: string
    HealthData:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ReadinessData:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          example: ready
        db:
          type: object
          required: [backend, ready, checks]
          properties:
            backend:
              type: string
              examples: [in_memory, sqlite, supabase]
            ready:
              type: boolean
            checks:
              type: object
              additionalProperties:
                type: boolean
    ProtectedStatusData:
      type: object
      required: [service]
      properties:
        service:
          type: string
          example: authenticated
    MetricsData:
      type: object
      required:
        [health_requests, readiness_requests, protected_requests, metrics_requests, auth_failures]
      properties:
        health_requests:
          type: integer
          minimum: 0
        readiness_requests:
          type: integer
          minimum: 0
        protected_requests:
          type: integer
          minimum: 0
        metrics_requests:
          type: integer
          minimum: 0
        auth_failures:
          type: integer
          minimum: 0
    SuccessEnvelope_Health:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/HealthData'
        trace_id:
          type: string
    SuccessEnvelope_Readiness:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/ReadinessData'
        trace_id:
          type: string
    SuccessEnvelope_Protected:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/ProtectedStatusData'
        trace_id:
          type: string
    SuccessEnvelope_Metrics:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/MetricsData'
        trace_id:
          type: string
    Submitter:
      type: object
      required: [external_user_id, identity_issuer]
      properties:
        external_user_id:
          type: string
        identity_issuer:
          type: string
    I18nObject:
      type: object
      required: [et, ru, en]
      description: >-
        Multilingual text object — all three keys required in intake contracts; in issue
        projections locale values may differ (GW-L10N-01). `original_locale` on issue projections — GW-L10N-02.
      properties:
        et:
          type: string
        ru:
          type: string
        en:
          type: string
      additionalProperties: false
    Narrative:
      type: object
      required: [original_text, language, session_language, title, description]
      properties:
        original_text:
          type: string
          description: Raw user-submitted text; language of this text is declared in `language`.
        language:
          type: string
          enum: [et, ru, en]
          description: Language of `original_text` (auto-detected by GPT layer, may differ from session_language).
        session_language:
          type: string
          enum: [et, ru, en]
          description: Language the user is interacting in (UI session language).
        title:
          $ref: '#/components/schemas/I18nObject'
          description: Multilingual title — all three et/ru/en required.
        description:
          $ref: '#/components/schemas/I18nObject'
          description: Multilingual description — all three et/ru/en required.
        summary:
          allOf:
            - $ref: '#/components/schemas/I18nObject'
          nullable: true
          description: Optional multilingual summary. If present, all three et/ru/en required.
        institution:
          allOf:
            - $ref: '#/components/schemas/I18nObject'
          nullable: true
          description: Optional i18n institution name (REQ-43); all of et, ru, en required when present.
        location_query:
          type: string
          nullable: true
          description: Freeform location string resolved to geo by the server. Empty/whitespace stored as null.
        canonical_type:
          type: string
          nullable: true
          description: "GPT taxonomy label — no enum enforcement at intake. Known values: complaint, observation, system_bug, absurdity."
        canonical_labels:
          type: array
          items:
            type: string
          description: Free-form tag strings. Each normalized to .strip().lower(); deduplicated preserving order.
    Origin:
      type: object
      properties:
        source:
          type: string
          nullable: true
        conversation_id:
          type: string
          nullable: true
        tool_call_id:
          type: string
          nullable: true
    Privacy:
      type: object
      properties:
        contains_pii:
          type: boolean
          default: false
        redaction_requested:
          type: boolean
          default: false
    LiveStoryContext:
      type: object
      properties:
        consistency_notes:
          type: string
          nullable: true
    TallinnIssueCreateRequest:
      type: object
      required: [cluster_id, story_ids, title]
      properties:
        cluster_id:
          type: string
          description: Cluster the issue belongs to.
        story_ids:
          type: array
          items:
            type: string
          description: Story UUIDs that form this issue.
        title:
          type: object
          description: >-
            Multilingual title map (et/ru/en). Locales may differ on stored projections (GW-L10N-01).
            Response includes `original_locale` when linked stories declare submitter languages (GW-L10N-02).
          additionalProperties:
            type: string
        type:
          type: string
          default: complaint
          enum: [complaint, system_bug, observation, absurdity]
          description: Issue type — defaults to "complaint".
    IssueProjectionGeo:
      type: object
      description: Geo snapshot attached to the issue (from dominant story geo resolution).
      properties:
        admin_district:
          type: string
          nullable: true
        admin_settlement:
          type: string
          nullable: true
        admin_region:
          type: string
          nullable: true
        admin_country:
          type: string
          nullable: true
        admin_postal_code:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lon:
          type: number
          nullable: true
    IssueProjection:
      type: object
      description: Public issue shape returned by GET /tallinn/issues and GET /tallinn/issues/{issue_id}. Source — DOGEIssue.to_public_dict().
      required: [id, status, type, labels, title, summary, description]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        type:
          type: string
          enum: [complaint, system_bug, observation, absurdity]
        labels:
          type: array
          items:
            type: string
        title:
          $ref: '#/components/schemas/I18nObject'
          description: Per-locale title; values may differ across et/ru/en (GW-L10N-01).
        summary:
          $ref: '#/components/schemas/I18nObject'
          description: Per-locale summary; values may differ across et/ru/en (GW-L10N-01).
        description:
          $ref: '#/components/schemas/I18nObject'
          description: Per-locale description; values may differ across et/ru/en (GW-L10N-01).
        institution:
          allOf:
            - $ref: '#/components/schemas/I18nObject'
          nullable: true
          description: Present only when story carries institution data (REQ-43).
        created_at:
          type: string
          format: date-time
          nullable: true
        arweave_txid:
          type: string
          nullable: true
        image_txid:
          type: string
          nullable: true
        image_hash:
          type: string
          nullable: true
        geo:
          allOf:
            - $ref: '#/components/schemas/IssueProjectionGeo'
          nullable: true
        original_locale:
          type: array
          items:
            type: string
            enum: [et, ru, en]
          description: >-
            Unique submitter narrative languages from all linked cluster stories, in canonical
            order et, ru, en. Omitted when unknown. Locales outside this list are treated as MT
            by the SPA (GW-L10N-02).
    SuccessEnvelope_IssueList:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [issues]
          properties:
            issues:
              type: array
              items:
                $ref: '#/components/schemas/IssueProjection'
        trace_id:
          type: string
    SuccessEnvelope_IssueGet:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [issue]
          properties:
            issue:
              $ref: '#/components/schemas/IssueProjection'
        trace_id:
          type: string
    SuccessEnvelope_IssueCreate:
      type: object
      required: [data, trace_id]
      properties:
        data:
          type: object
          required: [issue_id]
          properties:
            issue_id:
              type: string
        trace_id:
          type: string
    GptSignals:
      type: object
      description: Optional GPT classifier signals (REQ-42). Not stored on StoryRecord.
      properties:
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        impact_estimation:
          type: string
          enum: [LOCAL, DISTRICT, CITY, NATIONAL]
        problem_status:
          type: string
          enum: [ONGOING, RESOLVED, RECURRING, UNKNOWN]
    StoryIntakeRequest:
      type: object
      required: [schema_version, submitter, narrative]
      properties:
        schema_version:
          type: string
          enum:
            - m2.story_intake_envelope.v2
          description: "Only v2 is accepted at runtime. Sending v1 (m2.story_intake_envelope.v1) returns 400 with a migration message."
        submitter:
          $ref: '#/components/schemas/Submitter'
        narrative:
          $ref: '#/components/schemas/Narrative'
        origin:
          $ref: '#/components/schemas/Origin'
        privacy:
          $ref: '#/components/schemas/Privacy'
        live_story_context:
          $ref: '#/components/schemas/LiveStoryContext'
        gpt_signals:
          $ref: '#/components/schemas/GptSignals'
    IntakeNotes:
      type: object
      required: [geo_resolved, gpt_signals_persisted]
      properties:
        geo_resolved:
          type: boolean
          description: True if location_query was resolved to geo coordinates
        gpt_signals_persisted:
          type: boolean
          description: True if gpt_signals block was successfully saved to story_signals
    StoryIntakeResponseData:
      type: object
      required: [schema_version, story_id, status]
      properties:
        schema_version:
          type: string
          enum: [m2.story_intake_response.v1]
        story_id:
          type: string
        status:
          type: string
          enum: [ready_for_profile, partial_ready]
        intake_notes:
          $ref: '#/components/schemas/IntakeNotes'
    SuccessEnvelope_StoryIntake:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/StoryIntakeResponseData'
        trace_id:
          type: string
    StoryDraftCreateData:
      type: object
      required: [draft_id]
      properties:
        draft_id:
          type: string
          description: Opaque id for browser handoff (GW-DRAFT-01).
    SuccessEnvelope_StoryDraftCreate:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/StoryDraftCreateData'
        trace_id:
          type: string
    SuccessEnvelope_StoryDraftGet:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/StoryIntakeRequest'
        trace_id:
          type: string
    LabelMissRequest:
      type: object
      required: [label_key, locale]
      properties:
        label_key:
          type: string
          minLength: 1
          description: Canonical label key that had no dictionary translation (humanize-miss).
        locale:
          type: string
          enum: [et, ru, en]
          description: UI locale where translation was missing.
    LabelMissAcceptedData:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: >-
            True when the event was persisted; false on best-effort degrade when store is
            unavailable. No PII is collected (GW-L10N-03).
    SuccessEnvelope_LabelMiss:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/LabelMissAcceptedData'
        trace_id:
          type: string
paths:
  /health:
    get:
      tags: [Ops]
      summary: Return liveness status
      description: |
        Runtime state:
        - as-is behavior is implemented and routable via FastAPI (`GET /health`);
        - handler source: `handle_health`.
      operationId: getHealth
      x-runtime-state: as-is-active-fastapi-route
      responses:
        '200':
          description: Health envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Health'
              examples:
                ok:
                  value:
                    data:
                      status: ok
                    trace_id: trace-health-1
        '500':
          description: Unexpected or infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /ready:
    get:
      tags: [Ops]
      summary: Return readiness status
      description: |
        Runtime state:
        - as-is behavior is implemented and routable via FastAPI (`GET /ready`);
        - handler source: `handle_readiness`.
      operationId: getReadiness
      x-runtime-state: as-is-active-fastapi-route
      responses:
        '200':
          description: Readiness envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Readiness'
              examples:
                ready:
                  value:
                    data:
                      status: ready
                      db:
                        backend: supabase
                        ready: true
                        checks:
                          connectivity: true
                          schema: true
                          policy_probe: true
                    trace_id: trace-ready-1
  /protected/status:
    get:
      tags: [Ops]
      summary: Validate service authentication gate
      description: |
        Runtime state:
        - as-is behavior is implemented and routable via FastAPI (`GET /protected/status`);
        - route-level auth policy + handler-level defense-in-depth.
      operationId: getProtectedStatus
      x-runtime-state: as-is-active-fastapi-route
      security:
        - BearerAuth: []
        - ServiceTokenHeader: []
      responses:
        '200':
          description: Authenticated service envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Protected'
              examples:
                authenticated:
                  value:
                    data:
                      service: authenticated
                    trace_id: trace-protected-1
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthorized:
                  value:
                    error:
                      code: UNAUTHORIZED
                      type: auth
                      message: Missing service API token.
                      details: {}
                    trace_id: trace-protected-err-1
  /metrics:
    get:
      tags: [Ops]
      summary: Return in-process API counters
      description: |
        Runtime state:
        - as-is behavior is implemented and routable via FastAPI (`GET /metrics`);
        - route-level auth policy + handler-level defense-in-depth.
      operationId: getMetrics
      x-runtime-state: as-is-active-fastapi-route
      security:
        - BearerAuth: []
        - ServiceTokenHeader: []
      responses:
        '200':
          description: Metrics envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Metrics'
              examples:
                counters:
                  value:
                    data:
                      health_requests: 2
                      readiness_requests: 1
                      protected_requests: 1
                      metrics_requests: 3
                      auth_failures: 1
                    trace_id: trace-metrics-1
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /intake/stories:
    post:
      tags: [Intake]
      summary: Submit story intake payload
      description: |
        Runtime state:
        - intake contract exists in `src/core/intake/contracts.py`;
        - HTTP runtime handler is implemented in `src/core/api/asgi_app.py` (`POST /intake/stories`).
      operationId: postStoryIntake
      x-runtime-state: implemented-runtime-binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryIntakeRequest'
      responses:
        '202':
          description: Story accepted — clustering deferred to cron. Do not retry on 202.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_StoryIntake'
        '400':
          description: Intake validation error (DOMAIN_ERROR) or schema_version mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: location_query resolved to geo outside CLUSTER_GEO_SCOPE (GEO_SCOPE_MISMATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /story-drafts:
    post:
      tags: [Intake]
      summary: Stash story intake draft for browser handoff
      description: |
        Runtime state:
        - contract: same `StoryIntakeRequest` as `POST /intake/stories`;
        - auth: service token only (`require_public_content_service_auth`);
        - persists via `StoryDraftRepository` (no story/issue created);
        - handler: `handle_story_draft_create` in `src/core/api/handlers.py`.
      operationId: postStoryDraft
      x-runtime-state: implemented-runtime-binding
      security:
        - ServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryIntakeRequest'
      responses:
        '201':
          description: Draft stashed; returns opaque `draft_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_StoryDraftCreate'
        '400':
          description: Intake validation error (DOMAIN_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /story-drafts/{draft_id}:
    get:
      tags: [Intake]
      summary: Fetch stashed story draft by id
      description: |
        Runtime state:
        - returns saved intake JSON from draft store;
        - browser auth: `Authorization: Bearer` → identity `/me` (active session only, no phone_verified gate);
        - unknown or expired draft id → 404;
        - handler: `handle_story_draft_get`; dep: `require_story_draft_read_user`.
      operationId: getStoryDraft
      x-runtime-state: implemented-runtime-binding
      security:
        - BearerAuth: []
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Draft payload (StoryIntakeRequest shape in `data`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_StoryDraftGet'
        '404':
          description: Unknown or expired draft id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or inactive browser Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Identity `/me` unavailable or not configured (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /story-drafts/{draft_id}/submit:
    post:
      tags: [Intake]
      summary: Submit stashed story draft from browser (phone_verified gate)
      description: |
        Runtime state:
        - browser auth: `Authorization: Bearer` (Supabase session forwarded to identity `/me`);
        - gate: `evaluate_verification_gate` on `IntrospectionResult` from `IdentityMeClient`;
        - loads draft payload, creates story via `handle_story_intake` with `idempotency_key=draft_id`;
        - deletes draft on success; idempotent replay returns same `story_id` (202);
        - handler: `handle_story_draft_submit` in `src/core/api/handlers.py`.
      operationId: postStoryDraftSubmit
      x-runtime-state: implemented-runtime-binding
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Story created (same envelope as `POST /intake/stories`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_StoryIntake'
        '401':
          description: Missing/inactive browser Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Phone not verified (`verification_required` + `verify_url`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown or expired draft id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Identity `/me` unavailable or not configured (fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /telemetry/label-misses:
    post:
      tags: [Telemetry]
      summary: Report anonymous label translation miss (humanize fallback)
      description: |
        Runtime state:
        - public route (no service token); anonymous telemetry only — `label_key` + `locale`;
        - no cookies, session ids, or PII;
        - handler: `handle_label_miss_telemetry` in `src/core/api/handlers.py`;
        - MVP: no rate-limit (see STORY-GW-L10N-03 risks).
      operationId: postLabelMissTelemetry
      x-runtime-state: as-is-active-fastapi-route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelMissRequest'
      responses:
        '202':
          description: Event accepted (best-effort persist; `accepted` may be false if store degraded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_LabelMiss'
        '400':
          description: Invalid payload (generic validation error, no field details)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /tallinn/issues:
    options:
      tags: [Ops]
      summary: CORS preflight for issues list endpoint
      description: |
        Registered in asgi_app.py as @app.options("/tallinn/issues").
        Returns 200. Not intended for direct API use — handled by CORS middleware.
      operationId: optionsTallinnIssues
      x-runtime-state: as-is-active-fastapi-route
      responses:
        '200':
          description: CORS preflight accepted
    get:
      tags: [Intake]
      summary: List clustered issues for Tallinn SPA read model
      description: |
        Runtime state:
        - implemented in `src/core/api/asgi_app.py` (`GET /tallinn/issues`);
        - public route; reads `doge_issues` projections via `IssueProjectionReadStore`.
      operationId: listTallinnIssues
      x-runtime-state: as-is-active-fastapi-route
      parameters:
        - in: query
          name: status
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
