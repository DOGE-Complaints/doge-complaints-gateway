openapi: 3.1.0
info:
  title: DOGE Complaints Gateway Runtime API
  version: 0.1.0
  summary: Runtime reference for the current FastAPI/handler API surface
  description: |
    This specification is split into two states:
    - as-is: behavior implemented in `src/core/api/asgi_app.py` + `src/core/api/handlers.py`;
    - planned: higher-level endpoints not yet wired in runtime.

    Important:
    The current runtime is FastAPI/ASGI-based and exposes operational routes directly.
servers:
  - url: https://runtime.example
    description: Illustrative server URL for reference only
tags:
  - name: Ops
    description: Operational endpoints mapped to existing handlers
  - name: Intake
    description: Story-first intake contract surface
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceToken
    ServiceTokenHeader:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    ErrorBody:
      type: object
      required: [code, type, message, details]
      properties:
        code:
          type: string
          examples: [UNAUTHORIZED, VALIDATION_ERROR, DOMAIN_ERROR, INFRASTRUCTURE_ERROR, INTERNAL_ERROR]
        type:
          type: string
          examples: [auth, validation, domain, infrastructure, internal]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error, trace_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        trace_id:
          type: string
    HealthData:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ReadinessData:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          example: ready
        db:
          type: object
          required: [backend, ready, checks]
          properties:
            backend:
              type: string
              examples: [in_memory, sqlite, supabase]
            ready:
              type: boolean
            checks:
              type: object
              additionalProperties:
                type: boolean
    ProtectedStatusData:
      type: object
      required: [service]
      properties:
        service:
          type: string
          example: authenticated
    MetricsData:
      type: object
      required:
        [health_requests, readiness_requests, protected_requests, metrics_requests, auth_failures]
      properties:
        health_requests:
          type: integer
          minimum: 0
        readiness_requests:
          type: integer
          minimum: 0
        protected_requests:
          type: integer
          minimum: 0
        metrics_requests:
          type: integer
          minimum: 0
        auth_failures:
          type: integer
          minimum: 0
    SuccessEnvelope_Health:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/HealthData'
        trace_id:
          type: string
    SuccessEnvelope_Readiness:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/ReadinessData'
        trace_id:
          type: string
    SuccessEnvelope_Protected:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/ProtectedStatusData'
        trace_id:
          type: string
    SuccessEnvelope_Metrics:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/MetricsData'
        trace_id:
          type: string
    Submitter:
      type: object
      required: [external_user_id]
      properties:
        external_user_id:
          type: string
        identity_issuer:
          type: string
          nullable: true
    Narrative:
      type: object
      required: [original_text, language, title_hint]
      properties:
        original_text:
          type: string
        language:
          type: string
          enum: [et, ru, en]
        title_hint:
          type: string
        location_query:
          type: string
          nullable: true
        canonical_type:
          type: string
          nullable: true
        canonical_labels:
          type: array
          items:
            type: string
        institution:
          type: object
          nullable: true
          description: Optional i18n institution name (REQ-43); all of et, ru, en required when present
          properties:
            et:
              type: string
            ru:
              type: string
            en:
              type: string
          required: [et, ru, en]
    Origin:
      type: object
      properties:
        source:
          type: string
          nullable: true
        conversation_id:
          type: string
          nullable: true
        tool_call_id:
          type: string
          nullable: true
    Privacy:
      type: object
      properties:
        contains_pii:
          type: boolean
          default: false
        redaction_requested:
          type: boolean
          default: false
    LiveStoryContext:
      type: object
      properties:
        consistency_notes:
          type: string
          nullable: true
    GptSignals:
      type: object
      description: Optional GPT classifier signals (REQ-42). Not stored on StoryRecord.
      properties:
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        impact_estimation:
          type: string
          enum: [LOCAL, DISTRICT, CITY, NATIONAL]
        problem_status:
          type: string
          enum: [ONGOING, RESOLVED, RECURRING, UNKNOWN]
    StoryIntakeRequest:
      type: object
      required: [schema_version, submitter, narrative]
      properties:
        schema_version:
          type: string
          enum:
            - m2.story_intake_envelope.v1
            - m2.story_intake_envelope.v2
          description: Runtime accepts v2 only; v1 is rejected with 400.
        submitter:
          $ref: '#/components/schemas/Submitter'
        narrative:
          $ref: '#/components/schemas/Narrative'
        origin:
          $ref: '#/components/schemas/Origin'
        privacy:
          $ref: '#/components/schemas/Privacy'
        live_story_context:
          $ref: '#/components/schemas/LiveStoryContext'
        gpt_signals:
          $ref: '#/components/schemas/GptSignals'
    StoryIntakeResponseData:
      type: object
      required: [schema_version, story_id, status]
      properties:
        schema_version:
          type: string
          enum: [m2.story_intake_response.v1]
        story_id:
          type: string
        status:
          type: string
    SuccessEnvelope_StoryIntake:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: '#/components/schemas/StoryIntakeResponseData'
        trace_id:
          type: string
paths:
  /health:
    get:
      tags: [Ops]
      summary: Return liveness status
      description: |
        Runtime state:
        - as-is behavior is implemented and routable via FastAPI (`GET /health`);
        - handler source: `handle_health`.
      operationId: getHealth
      x-runtime-state: as-is-active-fastapi-route
      responses:
        '200':
          description: Health envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Health'
              examples:
                ok:
                  value:
                    data:
                      status: ok
                    trace_id: trace-health-1
        '500':
          description: Unexpected or infrastructure error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /ready:
    get:
      tags: [Ops]
      summary: Return readiness status
      description: |
        Runtime state:
        - as-is behavior is implemented and routable via FastAPI (`GET /ready`);
        - handler source: `handle_readiness`.
      operationId: getReadiness
      x-runtime-state: as-is-active-fastapi-route
      responses:
        '200':
          description: Readiness envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Readiness'
              examples:
                ready:
                  value:
                    data:
                      status: ready
                      db:
                        backend: supabase
                        ready: true
                        checks:
                          connectivity: true
                          schema: true
                          policy_probe: true
                    trace_id: trace-ready-1
  /protected/status:
    get:
      tags: [Ops]
      summary: Validate service authentication gate
      description: |
        Runtime state:
        - as-is behavior is implemented and routable via FastAPI (`GET /protected/status`);
        - route-level auth policy + handler-level defense-in-depth.
      operationId: getProtectedStatus
      x-runtime-state: as-is-active-fastapi-route
      security:
        - BearerAuth: []
        - ServiceTokenHeader: []
      responses:
        '200':
          description: Authenticated service envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Protected'
              examples:
                authenticated:
                  value:
                    data:
                      service: authenticated
                    trace_id: trace-protected-1
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthorized:
                  value:
                    error:
                      code: UNAUTHORIZED
                      type: auth
                      message: Missing service API token.
                      details: {}
                    trace_id: trace-protected-err-1
  /metrics:
    get:
      tags: [Ops]
      summary: Return in-process API counters
      description: |
        Runtime state:
        - as-is behavior is implemented and routable via FastAPI (`GET /metrics`);
        - route-level auth policy + handler-level defense-in-depth.
      operationId: getMetrics
      x-runtime-state: as-is-active-fastapi-route
      security:
        - BearerAuth: []
        - ServiceTokenHeader: []
      responses:
        '200':
          description: Metrics envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_Metrics'
              examples:
                counters:
                  value:
                    data:
                      health_requests: 2
                      readiness_requests: 1
                      protected_requests: 1
                      metrics_requests: 3
                      auth_failures: 1
                    trace_id: trace-metrics-1
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /intake/stories:
    post:
      tags: [Intake]
      summary: Submit story intake payload
      description: |
        Runtime state:
        - intake contract exists in `src/core/intake/contracts.py`;
        - HTTP runtime handler is implemented in `src/core/api/asgi_app.py` (`POST /intake/stories`).
      operationId: postStoryIntake
      x-runtime-state: implemented-runtime-binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryIntakeRequest'
      responses:
        '200':
          description: Story intake success envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_StoryIntake'
        '400':
          description: Intake validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /tallinn/issues:
    get:
      tags: [Intake]
      summary: List clustered issues for Tallinn SPA read model
      description: |
        Runtime state:
        - implemented in `src/core/api/asgi_app.py` (`GET /tallinn/issues`);
        - public route; reads `doge_issues` projections via `IssueProjectionReadStore`.
      operationId: listTallinnIssues
      x-runtime-state: as-is-active-fastapi-route
      parameters:
        - in: query
          name: status
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: labels
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: geo_lat_min
          schema:
            type: number
        - in: query
          name: geo_lat_max
          schema:
            type: number
        - in: query
          name: geo_lon_min
          schema:
            type: number
        - in: query
          name: geo_lon_max
          schema:
            type: number
        - in: query
          name: geo_district
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Issue list envelope
          content:
            application/json:
              schema:
                type: object
    post:
      tags: [Intake]
      summary: Manually create issue (operator)
      description: |
        Runtime state:
        - implemented in `src/core/api/asgi_app.py` (`POST /tallinn/issues`);
        - Bearer protected via `require_service_auth`.
      operationId: createTallinnIssue
      x-runtime-state: as-is-active-fastapi-route
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created issue id
        '401':
          description: Unauthorized
  /tallinn/issues/{issue_id}:
    get:
      tags: [Intake]
      summary: Get single issue projection by id
      operationId: getTallinnIssueById
      x-runtime-state: as-is-active-fastapi-route
      parameters:
        - in: path
          name: issue_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Issue envelope
        '404':
          description: Not found
  /demo/auth-page:
    get:
      tags: [Ops]
      summary: Return demo auth mock page
      description: |
        Runtime state:
        - as-is behavior is implemented and routable via FastAPI (`GET /demo/auth-page`);
        - static HTML is served from `demo/auth-page/index.html`.
      operationId: getDemoAuthPage
      x-runtime-state: as-is-active-fastapi-route
      responses:
        '200':
          description: Demo auth HTML page
          content:
            text/html:
              schema:
                type: string
  /demo/auth-page/styles.css:
    get:
      tags: [Ops]
      summary: Return demo auth page stylesheet
      description: |
        Runtime state:
        - as-is behavior is implemented and routable via FastAPI (`GET /demo/auth-page/styles.css`);
        - static CSS is served from `demo/auth-page/styles.css`.
      operationId: getDemoAuthStylesheet
      x-runtime-state: as-is-active-fastapi-route
      responses:
        '200':
          description: Demo auth CSS
          content:
            text/css:
              schema:
                type: string
