# REQ-41 GAP-41-05: live Supabase integration (Layer 5).
#
# Required GitHub repository secrets:
#   SUPABASE_TEST_URL              — PostgREST base URL (e.g. https://xxx.supabase.co)
#   SUPABASE_TEST_SERVICE_ROLE_KEY — service_role key for test project
#
# Architecture: docs/solution architecture/13-testing-and-quality-architecture.md §6
# Operator secrets naming: docs/requirements/41-testing-production-coverage-target-state.md §7 (GAP-41-05)

name: Gateway integration-live

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest-live-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest live_integration
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_SERVICE_ROLE: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: python -m pytest -q -m live_integration
